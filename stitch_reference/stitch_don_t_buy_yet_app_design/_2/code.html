<style>
        body {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }
        .polaroid-card {
            border: 2px solid #1b1c19;
            box-shadow: 4px 4px 0px 0px #1b1c19;
            background-color: #fbf9f4;
            transform: rotate(1deg);
        }
        .stamp {
            border: 2px dashed #fe6f42;
            color: #fe6f42;
            transform: rotate(-10deg);
        }
        .input-line {
            border-bottom: 2px solid #1b1c19;
            background-color: transparent;
        }
        .input-line:focus {
            outline: none;
            border-bottom: 3px solid #735c00;
        }
        .primary-button {
            border: 2px solid #1b1c19;
            box-shadow: 4px 4px 0px 0px #1b1c19;
            transition: all 0.1s ease;
        }
        .primary-button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px 0px #1b1c19;
        }
        .receipt-strip {
            border-top: 1px dashed #1b1c19;
            border-bottom: 1px dashed #1b1c19;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md selection:bg-primary-container selection:text-on-primary-container pb-32">
<!-- TopAppBar JSON Translation -->
<header class="flex justify-between items-center w-full px-container-padding py-base max-w-md mx-auto bg-background text-primary border-b-2 border-on-background shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] sticky top-0 z-40">
<button class="hover:bg-surface-variant active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all p-2 rounded-full flex items-center justify-center text-outline">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">edit_note</span>
</button>
<h1 class="font-display-lg text-display-lg-mobile text-primary -rotate-2">先别买</h1>
<button class="hover:bg-surface-variant active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all p-2 rounded-full flex items-center justify-center text-outline">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</button>
</header>
<main class="max-w-md mx-auto px-container-padding pt-8 pb-12 overflow-x-hidden">
<h2 class="font-headline-lg text-headline-lg mb-8 text-on-background -rotate-1 relative z-10 bg-tertiary-container inline-block px-2 border-2 border-on-background shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
            先确认一下， <br/> 别劝错东西了。
        </h2>
<!-- Product Details Polaroid -->
<div class="polaroid-card p-4 mb-8 relative z-20">
<!-- Stamp -->
<div class="stamp absolute -top-4 -right-2 px-3 py-1 font-note-handwritten text-note-handwritten bg-background z-30 font-bold">
                等你确认
            </div>
<div class="mb-4 aspect-square w-full bg-surface-variant border-2 border-on-background overflow-hidden relative">
<img alt="Product Image" class="w-full h-full object-cover mix-blend-multiply" data-alt="A clean, minimalist editorial photo of wireless noise-canceling headphones resting on a textured cream paper surface. Warm natural lighting from the side casting a sharp shadow. The aesthetic is modern, analog, and premium with a slight neobrutalist edge." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBjV1pdaYEw21bLfnRnyDjklhcQLTLefV-3ZGyC_o_80uYlr3Xeqi4ED0zyODsecFG0ynz-HrnTcIz6GwHKDYYL98fGdwNp8IKBwJu0fzG3CH_cPz2X5bECb21elkSuypLFlhXKx2Egji9qqbSvNBS4YU-8aY82cucBmvg6iBX_av8bSfuQFNL4UIWamZyiHYQOjH5OSNIUk546GK6-0Kx2L9V48e2xsxyMC-6SnYvEx0DmBPl75uOp25ia7Y2OxNfA3KUXNb8aORnA"/>
</div>
<form class="flex flex-col gap-4">
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-outline mb-1">名称</label>
<input class="input-line font-body-lg text-body-lg text-on-background py-1 w-full" type="text" value="无线降噪耳机"/>
</div>
<div class="flex gap-4">
<div class="flex flex-col flex-1">
<label class="font-label-caps text-label-caps text-outline mb-1">品牌型号</label>
<input class="input-line font-body-md text-body-md text-on-background py-1 w-full" type="text" value="示例型号 X1"/>
</div>
<div class="flex flex-col flex-1">
<label class="font-label-caps text-label-caps text-outline mb-1">价格</label>
<input class="input-line font-body-md text-body-md text-on-background py-1 w-full font-bold" type="text" value="¥1,899"/>
</div>
</div>
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-outline mb-1">分类</label>
<select class="input-line font-body-md text-body-md text-on-background py-1 w-full appearance-none bg-transparent">
<option>数码产品</option>
<option>服饰</option>
<option>家居</option>
</select>
</div>
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-outline mb-1">核心参数</label>
<textarea class="input-line font-body-md text-body-md text-on-background py-1 w-full resize-none h-16" rows="2">主动降噪、蓝牙连接、约 30 小时续航</textarea>
</div>
</form>
</div>
<!-- Receipt Notice -->
<div class="receipt-strip bg-surface-container-low p-4 mb-8 text-center -rotate-1 relative bg-opacity-70 backdrop-blur-sm">
<p class="font-note-handwritten text-note-handwritten text-on-surface-variant flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">info</span>
                没有确认的信息，不会被当作判断依据。
            </p>
</div>
<!-- Actions -->
<div class="flex flex-col gap-4">
<button class="primary-button bg-primary-container text-on-primary-container font-headline-md text-headline-md py-4 w-full uppercase tracking-wider relative overflow-hidden group">
<span class="relative z-10">信息没问题，开始审问</span>
<!-- Tape effect -->
<div class="absolute -top-2 left-1/2 -translate-x-1/2 w-24 h-4 bg-tertiary opacity-30 rotate-3 mix-blend-multiply"></div>
</button>
<button class="bg-transparent border-2 border-on-background text-on-background font-body-lg text-body-lg py-3 w-full hover:bg-surface-variant transition-colors hover:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:translate-x-[1px] active:translate-y-[1px] active:shadow-none">
                重新识别
            </button>
</div>
</main>
<!-- BottomNavBar JSON Translation - Navigation Suppressed as this is a transactional flow (Confirmation Screen) -->
<!-- As per rule: Automatic Suppression: You MUST exclude the navigation shell if the page intent is Linear/Transactional... -->
</body></html>
